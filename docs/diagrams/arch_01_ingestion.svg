  <text x="300" y="339" text-anchor="middle" fill="#56d364" font-size="12" font-weight="700" font-family="ui-sans-serif,system-ui,sans-serif">DuckDB</text>
  <text x="300" y="355" text-anchor="middle" fill="#3fb950" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">cpie.chunks table</text>
  <line x1="300" y1="373" x2="300" y2="398" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a1)"/>
