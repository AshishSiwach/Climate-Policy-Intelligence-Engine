# CPIE — monitoring stack (Week 5 Step 4)
#
# Services:
#   postgres  — query log + user feedback storage (Step 4a)
#   grafana   — added in Step 4c
#   app       — Streamlit + CLI, added in Week 6 (Docker packaging)
#
# Bring up just Postgres for development:
#   docker compose up -d postgres
#
# Bring down + keep data:
#   docker compose down
#
# Bring down + WIPE data (re-runs init.sql on next up):
#   docker compose down -v
#
# Credentials come from .env in this directory. See .env.example for the
# template. Default dev password is committed there — DO NOT reuse in prod.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cpie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-cpie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpie_dev_only}
      POSTGRES_DB:       ${POSTGRES_DB:-cpie}
    ports:
      # Host-side port exposed for local dev + Grafana on host. In prod
      # deploy, drop this line and route Grafana via docker network only.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Named volume for durable data across container restarts.
      - cpie_pgdata:/var/lib/postgresql/data
      # Init script — runs ONCE on first startup (empty volume). To re-run
      # after schema changes: docker compose down -v && docker compose up -d.
      - ./monitoring/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # pg_isready — postgres's own readiness probe. Compose won't consider
      # the service healthy until this passes; other services can depends_on
      # this with condition: service_healthy.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpie} -d ${POSTGRES_DB:-cpie}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: cpie_grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy   # don't start Grafana until Postgres is up
    environment:
      # Default admin creds — Grafana forces a password change on first UI
      # login, so this is only the initial credential. Override via .env for
      # public deploys.
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymous view — off for now; flip to true if you want the dashboards
      # publicly viewable without login (e.g. for a demo).
      GF_AUTH_ANONYMOUS_ENABLED:  "false"
      # Silence Grafana's phone-home update check in dev.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Pass Postgres creds into Grafana's env so the provisioning YAML can
      # reference ${env}-style expansions.
      POSTGRES_USER:     ${POSTGRES_USER:-cpie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpie_dev_only}
      POSTGRES_DB:       ${POSTGRES_DB:-cpie}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      # Provisioning YAMLs — Grafana reads on startup, no manual clicks.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON — mounted read-only; the provisioning YAML points here.
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Named volume for the Grafana DB (users, api keys, alert history).
      - cpie_grafana_data:/var/lib/grafana

  app:
    build: .
    container_name: cpie_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENAI_API_KEY:    ${OPENAI_API_KEY}
      POSTGRES_HOST:     postgres          # docker-internal service name
      POSTGRES_PORT:     ${POSTGRES_PORT:-5432}
      POSTGRES_USER:     ${POSTGRES_USER:-cpie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpie_dev_only}
      POSTGRES_DB:       ${POSTGRES_DB:-cpie}
    volumes:
      # Mount corpus PDFs and processed indices — run ingestion locally first,
      # then the container reads from data/processed/ at startup.
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed:ro
      - ./logs:/app/logs
    ports:
      - "${APP_HOST_PORT:-8501}:8501"

volumes:
  cpie_pgdata:
    name: cpie_pgdata
  cpie_grafana_data:
    name: cpie_grafana_data
