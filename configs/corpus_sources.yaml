# Canonical public URLs for the CPIE corpus PDFs.
# Used by scripts/download_data.py to reproduce data/raw/ on a fresh clone.
#
# All documents are publicly available from their issuing institutions.
# Do not commit the PDFs themselves — they are gitignored.
# Run `make data` (or `uv run python scripts/download_data.py`) to fetch them.
#
# SHA-256 checksums are recorded here after the initial download so future
# runs can verify file integrity. Leave as null on first add; the script
# fills them in automatically on --record-checksums.

documents:
  - filename: "739682_ESO_Beyond2030_Report_2024_PRINT.pdf"
    doc_id: "ESO_BEYOND2030_2024"
    institution: "ESO"
    url: "https://www.nationalgrideso.com/document/333526/download"
    sha256: null  # run with --record-checksums to populate

