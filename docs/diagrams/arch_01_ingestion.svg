  <line x1="300" y1="444" x2="300" y2="464" stroke="#6e7681" stroke-width="1.5"/>
  <line x1="148" y1="464" x2="452" y2="464" stroke="#6e7681" stroke-width="1.5"/>
  <line x1="148" y1="464" x2="148" y2="477" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="452" y1="464" x2="452" y2="477" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a1)"/>
