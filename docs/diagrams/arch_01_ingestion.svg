  <rect x="63" y="479" width="170" height="44" rx="8" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="148" y="497" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">BM25 Index</text>
  <text x="148" y="514" text-anchor="middle" fill="#58a6ff" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">bm25_index.pkl</text>
