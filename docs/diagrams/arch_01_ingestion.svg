  <text x="300" y="133" text-anchor="middle" fill="#8b949e" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">Tier 1 strip (ESO/Ofgem) · Tier 2 heading inject</text>
  <line x1="300" y1="147" x2="300" y2="174" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a1)"/>
