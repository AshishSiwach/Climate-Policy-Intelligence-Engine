  <text x="452" y="497" text-anchor="middle" fill="#56d364" font-size="12" font-weight="600" font-family="ui-sans-serif,system-ui,sans-serif">Chroma Index</text>
  <text x="452" y="514" text-anchor="middle" fill="#3fb950" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">chroma_db/ · BAAI/bge-base-en-v1.5</text>
