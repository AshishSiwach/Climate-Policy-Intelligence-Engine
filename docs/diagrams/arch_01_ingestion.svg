  <text x="300" y="57" text-anchor="middle" fill="#58a6ff" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">12 public climate policy documents</text>
  <line x1="300" y1="66" x2="300" y2="93" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a1)"/>
  <!-- PyMuPDF + Cleaner -->
  <rect x="172" y="95" width="256" height="52" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
