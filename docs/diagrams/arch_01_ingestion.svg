<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 538" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#161b22" rx="12"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#6e7681"/>
    </marker>
  </defs>
  <!-- PDF Corpus -->
  <rect x="200" y="22" width="200" height="44" rx="8" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1.5"/>
