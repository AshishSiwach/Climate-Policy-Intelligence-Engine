  <text x="300" y="292" text-anchor="middle" fill="#8b949e" font-size="10" font-family="ui-sans-serif,system-ui,sans-serif">merge write-disposition · incremental</text>
  <line x1="300" y1="301" x2="300" y2="319" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a1)"/>
